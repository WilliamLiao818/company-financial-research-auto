name: Refresh public company data

on:
  workflow_dispatch:
    inputs:
      feed:
        description: Public dataset to refresh
        type: choice
        default: all
        options: [all, filings, market, news]
  schedule:
    - cron: "37 3 * * *"
    - cron: "13 13-23/2 * * 1-5"
    - cron: "43 13-23/2 * * 1-5"

concurrency:
  group: publish-public-company-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write
    env:
      FEED: ${{ inputs.feed || (github.event.schedule == '13 13-23/2 * * 1-5' && 'filings') || (github.event.schedule == '43 13-23/2 * * 1-5' && 'news') || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check source feeds and retain last verified data on failure
        id: fetch
        env:
          SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL }}
        run: python scripts/refresh_public_data.py --feeds "$FEED"
      - name: Export lightweight company briefs for the public homepage
        run: python scripts/export_lite.py
      - name: Validate the updated public data and application
        run: python -m unittest discover -s tests -v
      - name: Publish data and status in one revision
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/financials.csv data/market_performance.csv data/recent_news.json data/refresh_status.json data/lite_briefs.json
          if test -f data/filings.json; then git add -- data/filings.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public company research data"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Alert on a newly unavailable entire feed
        if: steps.fetch.outputs.new_outages != ''
        env:
          NEW_OUTAGES: ${{ steps.fetch.outputs.new_outages }}
        run: |
          echo "::error::Published the update status. Every company retained its previous data for: $NEW_OUTAGES"
          exit 1
