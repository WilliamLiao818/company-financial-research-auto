name: Validate and optionally refresh SEC snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  refresh-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Refresh public SEC snapshot when contact is configured
        if: ${{ vars.SEC_CONTACT_EMAIL != '' }}
        env:
          SEC_USER_AGENT: "${{ github.repository }} ${{ vars.SEC_CONTACT_EMAIL }}"
        run: python scripts/build_snapshot.py --output refreshed/financials.csv
      - uses: actions/upload-artifact@v4
        if: ${{ vars.SEC_CONTACT_EMAIL != '' }}
        with:
          name: refreshed-financial-snapshot
          path: refreshed/financials.csv
